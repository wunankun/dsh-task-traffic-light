name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  app:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build universal bundle
        run: ./macos/build.sh

      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent macos/TaskTrafficLight.app TaskTrafficLight.zip

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          files: TaskTrafficLight.zip
          generate_release_notes: true

  npm:
    name: npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check the sources parse
        run: |
          node --check index.js
          node --check client.js

      - name: Publish
        # Skipped without an NPM_TOKEN, and idempotent: re-running a tag whose
        # version is already on the registry is not a failure.
        if: env.NPM_TOKEN != ''
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published; nothing to do."
          else
            # npm stages a new version for a while: a parallel publish (or a
            # manual one from the maintainer) shows up as E409. If the version
            # lands after a short wait, that counts as success.
            npm publish || {
              sleep 30
              npm view "$name@$version" version >/dev/null 2>&1 \
                && echo "$name@$version was published by another run."
            }
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
