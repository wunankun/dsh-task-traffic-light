<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" role="img" aria-label="DSH 任务红绿灯：红灯干活中，黄灯等你处理，绿灯跑完还没看">
  <rect width="760" height="220" rx="18" fill="#0f1013"/>
  <rect x="46" y="30" width="96" height="160" rx="22" fill="#1b1c20" stroke="#33353b"/>
  <circle cx="94" cy="70" r="26" fill="#ff5b50" opacity="0.18"/>
  <circle cx="94" cy="110" r="26" fill="#ffd60a" opacity="0.18"/>
  <circle cx="94" cy="150" r="26" fill="#30d158" opacity="0.18"/>
  <circle cx="94" cy="70" r="20" fill="#ff5b50"/>
  <circle cx="94" cy="110" r="20" fill="#ffd60a"/>
  <circle cx="94" cy="150" r="20" fill="#30d158"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif">
    <text x="186" y="64" fill="#f2f3f5" font-size="21" font-weight="600">红灯</text>
    <text x="250" y="64" fill="#9aa0a6" font-size="21">· 有会话正在干活</text>
    <text x="186" y="104" fill="#f2f3f5" font-size="21" font-weight="600">黄灯</text>
    <text x="250" y="104" fill="#9aa0a6" font-size="21">· 有审批或提问等你处理</text>
    <text x="186" y="144" fill="#f2f3f5" font-size="21" font-weight="600">绿灯</text>
    <text x="250" y="144" fill="#9aa0a6" font-size="21">· 跑完了，你还没打开看过</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14">
    <text x="186" y="182" fill="#6f747b">点亮着的那盏灯，直接跳到对应会话</text>
  </g>
</svg>
